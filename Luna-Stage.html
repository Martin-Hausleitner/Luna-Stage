let pointer=null;function pointerDown(e){if(e.button!==0)return;pointer={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};e.currentTarget.setPointerCapture(e.pointerId)}function pointerMove(e){if(!pointer)return;let dx=e.clientX-pointer.lastX,dy=e.clientY-pointer.lastY;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>5)pointer.moved=true;if(pointer.moved&&Luna.gpu.ready){Luna.cam.playing=false;Luna.cam.manual=true;Luna.cam.transition=null;let v=V.sub(Luna.cam.eye,Luna.cam.to),r=Math.hypot(...v),theta=Math.atan2(v[0],v[2])-dx*.0045,phi=clamp(Math.acos(v[1]/r)+dy*.0035,.24,1.53);Luna.cam.eye=V.add(Luna.cam.to,[r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.cos(theta)]);Luna.hud.sync();Luna.gpu.invalidate()}pointer.lastX=e.clientX;pointer.lastY=e.clientY}

Luna.gpu.snapshot=async()=>{if(Luna.gpu.snapshotBusy)return;Luna.gpu.snapshotBusy=true;const old={eye:[...Luna.cam.eye],to:[...Luna.cam.to],fov:Luna.cam.fov,chapter:Luna.cam.chapter,time:Luna.cam.time,playing:Luna.cam.playing,manual:Luna.cam.manual,transition:Luna.cam.transition,scene:{sun:Luna.scene.sun,material:Luna.scene.material,price:Luna.scene.price,ceo:Luna.scene.ceo}};try{Luna.cam.goto(2,false);Luna.scene.price=false;Luna.scene.ceo=false;const out=document.createElement('canvas');out.width=1920;out.height=1080;const g=out.getContext('2d');if(Luna.gpu.ready){g.putImageData(await Luna.gpu.readPixels(1920,1080),0,0)}else Luna.gpu.drawStill(out,2);g.fillStyle='rgba(9,18,27,.30)';g.fillRect(0,1018,1920,62);g.font='400 14px Segoe UI, Arial';g.fillStyle='#ddd5c5';g.fillText('STAGE / Berger / Abend',44,1055);g.textAlign='right';g.font='400 12px Segoe UI, Arial';g.fillText('EDV Hausleitner · LUNA STAGE',1876,1055);const blob=await new Promise(resolve=>out.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG export failed');Luna.gpu.lastSnapshot={width:1920,height:1080,type:blob.type,bytes:blob.size};const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='STAGE-Berger-Abend.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){Luna.hud.hint('Standbild konnte nicht gespeichert werden.');Luna.gpu.errors.push(String(e))}finally{Object.assign(Luna.cam,{eye:old.eye,to:old.to,fov:old.fov,chapter:old.chapter,time:old.time,playing:old.playing,manual:old.manual,transition:old.transition});Object.assign(Luna.scene,old.scene);Luna.gpu.snapshotBusy=false;Luna.hud.sync();Luna.gpu.invalidate()}};
