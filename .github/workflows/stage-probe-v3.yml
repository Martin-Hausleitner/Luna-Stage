name: STAGE bounded shader probe
on:
  push:
    branches: ['stage/visual-v2']
    paths: ['qa/stage-v3/PROBE.json']
permissions:
  contents: read
jobs:
  frame:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0 Pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - run: python qa/stage-v3/build.py
      - name: Bounded native frame
        run: |
          python -u - <<'PY'
          import subprocess,sys
          try: subprocess.run([sys.executable,'-u','qa/stage-v3/probe.py'],check=True,timeout=300)
          except Exception as e: print(e);sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-probe-${{ matrix.os }}
          path: qa/probe/
          retention-days: 2
