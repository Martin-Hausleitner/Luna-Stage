name: STAGE HTML detail verification
on:
  push:
    branches: ['stage/visual-v2']
    paths: ['qa/stage-v3/RUN.json']
permissions:
  contents: read
concurrency:
  group: stage-detail-v3
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0 Pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - name: Build the existing kitchen with real embedded materials and 3D details
        run: python qa/stage-v3/build.py
      - name: Execute native WGSL and verify the real browser application
        run: python qa/stage-v3/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Luna-Stage-HTML-v3
          path: |
            Luna-Stage.html
            README.md
            LICENSE
            qa/v3/
            qa/stage-v3/
            qa/stage-v2/asset-receipt.json
          retention-days: 7
