name: STAGE native acceptance frames
on:
  push:
    branches: ['stage/visual-v2']
    paths: ['qa/stage-v3/FRAMES.json']
permissions:
  contents: read
concurrency:
  group: stage-v3-frames
  cancel-in-progress: true
jobs:
  render:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chapter: [2,4,7,0,1,3,5,6]
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0 Pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - name: Build the actual room
        run: |
          python qa/stage-v3/build.py
          python qa/stage-v3/polish.py
          python qa/stage-v3/export_fix.py
      - name: Native 1920x1080 frame and controls
        run: python -u qa/stage-v3/frame.py ${{ matrix.chapter }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-v3-frame-${{ matrix.chapter }}
          path: |
            Luna-Stage.html
            qa/frames/
            qa/stage-v2/asset-receipt.json
          retention-days: 7
