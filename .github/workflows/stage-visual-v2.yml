name: STAGE 2 visual candidate
on:
  push:
    branches: ['stage/visual-v2']
    paths: ['qa/stage-v2/RUN.json']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0 Pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - name: Embed CC0 material photography and compile the one-file room
        run: python qa/stage-v2/build.py
      - name: Execute shaders, interactions and capture the real UI
        run: python qa/stage-v2/verify.py
      - name: Publish candidate source and receipts on the isolated candidate branch
        run: |
          git config user.name 'LUNA STAGE Build'
          git config user.email '55828102+Martin-Hausleitner@users.noreply.github.com'
          git add Luna-Stage.html qa/v2 qa/stage-v2/asset-receipt.json
          git commit -m 'Build STAGE 2 candidate with embedded photography and native GPU evidence' || true
          git push origin HEAD:stage/visual-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Luna-Stage-v2-candidate
          path: |
            Luna-Stage.html
            README.md
            LICENSE
            qa/v2/
            qa/stage-v2/
          retention-days: 7
